<!DOCTYPE html>
<html>
<head>
<title>Smart Attendance</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
height:100vh;
font-family:Poppins;
background:linear-gradient(135deg,#0f2027,#2c5364,#1c92d2);
background-size:400% 400%;
animation:bgMove 10s infinite alternate;
display:flex;
justify-content:center;
align-items:center;
color:white;
overflow:hidden;
}

/* 🔥 BACKGROUND ANIMATION */
@keyframes bgMove{
0%{background-position:0% 50%;}
100%{background-position:100% 50%;}
}

/* 🔝 TOP SCROLL TEXT */
.top-scroll{
position:absolute;
top:15px;
width:100%;
overflow:hidden;
white-space:nowrap;
font-size:26px;
font-weight:bold;
letter-spacing:3px;
color:#00e5ff;
}

.top-scroll span{
display:inline-block;
padding-left:100%;
animation:scroll 12s linear infinite;
}

/* 🔻 BOTTOM SCROLL TEXT */
.bottom-scroll{
position:absolute;
bottom:15px;
width:100%;
overflow:hidden;
white-space:nowrap;
font-size:20px;
font-weight:bold;
color:#ffd700;
}

.bottom-scroll span{
display:inline-block;
padding-left:100%;
animation:scroll 15s linear infinite;
}

/* SCROLL ANIMATION */
@keyframes scroll{
0%{transform:translateX(0);}
100%{transform:translateX(-100%);}
}

/* 💎 GLASS CARD */
.card{
background:rgba(255,255,255,0.1);
padding:50px;
border-radius:25px;
backdrop-filter:blur(15px);
text-align:center;
width:350px;
box-shadow:0 0 40px rgba(0,0,0,0.5);
animation:fadeIn 1.2s ease;
}

/* ✨ ENTRY ANIMATION */
@keyframes fadeIn{
from{opacity:0; transform:translateY(30px);}
to{opacity:1;}
}

.card h2{
margin-bottom:30px;
}

/* 🔘 BUTTONS */
button{
width:100%;
padding:15px;
margin:12px 0;
border:none;
border-radius:30px;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

/* 🔴 FACULTY BUTTON */
.login{
background:linear-gradient(45deg,#ff4b5c,#ff0066);
color:white;
box-shadow:0 0 20px rgba(255,0,102,0.6);
}

.login:hover{
transform:scale(1.08);
box-shadow:0 0 35px rgba(255,0,102,1);
}

/* 🟢 STUDENT BUTTON */
.report{
background:linear-gradient(45deg,#00c9a7,#92fe9d);
color:black;
box-shadow:0 0 20px rgba(0,255,200,0.6);
}

.report:hover{
transform:scale(1.08);
box-shadow:0 0 35px rgba(0,255,200,1);
}

</style>
</head>

<body>

<!-- 🔝 TOP TITLE -->
<div class="top-scroll">
<span>SMART ATTENDANCE SYSTEM • SMART ATTENDANCE SYSTEM • SMART ATTENDANCE SYSTEM</span>
</div>

<!-- 💎 CARD -->
<div class="card">

<h2>Smart Attendance System</h2>

<a href="{{ url_for('login') }}">
<button class="login">Faculty Login</button>
</a>

<a href="{{ url_for('student_report') }}">
<button class="report">Student Report</button>
</a>

</div>

<!-- 🔻 FOOTER WATERMARK -->
<div class="bottom-scroll">
<span>DEVELOPED BY • J LAKSHMAN CHOWDARY • A LIKHITH • K SAKETH CHOWDARY </span>
</div>

</body>
</html>
