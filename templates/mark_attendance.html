<!DOCTYPE html>
<html>
<head>
    <title>Mark Attendance</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #43cea2, #185a9d);
            color: white;
            font-family: 'Poppins', sans-serif;
        }

        .container-box {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 30px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
            max-height: 55vh;
            overflow-y: auto;
        }

        .student-card {
            background: rgba(255,255,255,0.2);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            gap: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .student-card:hover {
            background: rgba(255,255,255,0.35);
        }

        .student-card.active {
            background: #ff6b6b !important;
        }

        .student-info {
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .stat-box {
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container-fluid px-4">

    <!-- HEADER -->
    <div class="top-bar mt-3">
        <h2>📋 Mark Attendance</h2>

        <div>
            <a href="{{ url_for('dashboard') }}" class="btn btn-light me-2">⬅ Back</a>
            <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
        </div>
    </div>

    <div class="container-box mt-3">

        <!-- 🔍 SEARCH -->
        <input type="text" id="searchBox" class="form-control mb-3"
               placeholder="🔍 Search student...">

        <!-- 📊 LIVE STATS -->
        <div class="stats">
            <div class="stat-box">Present: <b id="presentCount">0</b></div>
            <div class="stat-box">Absent: <b id="absentCount">0</b></div>
        </div>

        <!-- ACTION BUTTONS -->
        <div class="mb-3">
            <button type="button" class="btn btn-light btn-sm" onclick="selectAll()">Select All</button>
            <button type="button" class="btn btn-light btn-sm" onclick="clearAll()">Clear All</button>
        </div>

        <form method="POST" onsubmit="return confirmSubmit()">

            <label>Select Hour:</label>
            <select name="hour" class="form-control mb-3">
                <option value="1">Hour 1</option>
                <option value="2">Hour 2</option>
                <option value="3">Hour 3</option>
                <option value="4">Hour 4</option>
                <option value="5">Hour 5</option>
                <option value="6">Hour 6</option>
            </select>

            <h5>Select Absent Students</h5>

            <div class="grid-container">

                {% for student in students %}
                <label class="student-card" data-name="{{ student.name|lower }}">
                    <input type="checkbox" name="absent" value="{{ student.student_id }}">

                    <div class="student-info">
                        <span><b>{{ student.student_id }}</b></span>
                        <span>{{ student.name }}</span>
                    </div>
                </label>
                {% endfor %}

            </div>

            <button class="btn btn-light w-100 mt-4">
                ✅ Submit Attendance
            </button>

        </form>

    </div>

</div>

<script>
    const checkboxes = document.querySelectorAll("input[type='checkbox']");
    const presentCount = document.getElementById("presentCount");
    const absentCount = document.getElementById("absentCount");

    function updateStats() {
        let absent = 0;
        checkboxes.forEach(cb => {
            if (cb.checked) absent++;
        });

        absentCount.innerText = absent;
        presentCount.innerText = checkboxes.length - absent;
    }

    checkboxes.forEach(cb => {
        cb.addEventListener("change", function () {
            this.closest(".student-card").classList.toggle("active", this.checked);
            updateStats();
        });
    });

    function selectAll() {
        checkboxes.forEach(cb => {
            cb.checked = true;
            cb.closest(".student-card").classList.add("active");
        });
        updateStats();
    }

    function clearAll() {
        checkboxes.forEach(cb => {
            cb.checked = false;
            cb.closest(".student-card").classList.remove("active");
        });
        updateStats();
    }

    document.getElementById("searchBox").addEventListener("keyup", function () {
        let value = this.value.toLowerCase();

        document.querySelectorAll(".student-card").forEach(card => {
            let name = card.getAttribute("data-name");
            card.style.display = name.includes(value) ? "flex" : "none";
        });
    });

    function confirmSubmit() {
        return confirm("Are you sure you want to submit attendance?");
    }

    updateStats();
</script>

</body>
</html>
