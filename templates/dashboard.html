<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins;
background:#0f172a;
color:white;
overflow:hidden;
}

/* ===== LOADER ===== */
#loader{
position:fixed;
width:100%;
height:100%;
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.loader-circle{
width:60px;
height:60px;
border:6px solid #38bdf8;
border-top:6px solid transparent;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{transform:rotate(360deg);}
}

/* ===== SIDEBAR ===== */
.sidebar{
width:230px;
height:100vh;
background:#020617;
position:fixed;
padding:20px;
}

.sidebar h3{
color:#38bdf8;
margin-bottom:30px;
}

.sidebar a{
display:block;
color:white;
padding:12px;
margin:10px 0;
border-radius:10px;
text-decoration:none;
transition:0.3s;
}

.sidebar a:hover{
background:#38bdf8;
}

/* ===== MAIN ===== */
.main{
margin-left:250px;
padding:30px;
}

/* ===== CARDS ===== */
.card-ui{
background:rgba(255,255,255,0.05);
padding:25px;
border-radius:20px;
text-align:center;
transition:0.3s;
animation:fadeIn 1s ease;
}

.card-ui:hover{
transform:translateY(-5px);
background:rgba(255,255,255,0.1);
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(20px);}
to{opacity:1;}
}

/* ===== BUTTON ===== */
.btn-glow{
background:#38bdf8;
border:none;
color:black;
padding:10px;
border-radius:10px;
}

</style>
</head>

<body>

<!-- 🔄 LOADER -->
<div id="loader">
    <div class="loader-circle"></div>
</div>

<!-- 📊 SIDEBAR -->
<div class="sidebar">
    <h3>📊 Dashboard</h3>

    <a href="/dashboard">🏠 Home</a>
    <a href="/mark_attendance">📝 Attendance</a>
    <a href="/student_report">📈 Reports</a>

    <hr>

    <a href="/logout" style="color:red;">🚪 Logout</a>
</div>

<!-- 📦 MAIN CONTENT -->
<div class="main">

<h2>Welcome {{ faculty.name if faculty else "Admin" }}</h2>

<div class="row mt-4">

<div class="col-md-4">
<div class="card-ui">
<h4>📋 Mark Attendance</h4>
<a href="/mark_attendance" class="btn btn-glow mt-2">Open</a>
</div>
</div>

<div class="col-md-4">
<div class="card-ui">
<h4>📊 Reports</h4>
<a href="/student_report" class="btn btn-glow mt-2">View</a>
</div>
</div>

<div class="col-md-4">
<div class="card-ui">
<h4>📥 Excel Report</h4>

<select id="month" class="form-control mb-2">
<option value="1">January</option>
<option value="2">February</option>
<option value="3">March</option>
<option value="4">April</option>
<option value="5">May</option>
<option value="6">June</option>
<option value="7">July</option>
<option value="8">August</option>
<option value="9">September</option>
<option value="10">October</option>
<option value="11">November</option>
<option value="12">December</option>
</select>

<button onclick="download()" class="btn btn-glow w-100">Download</button>

</div>
</div>

</div>

</div>

<script>
// LOADER HIDE
window.onload = function(){
    document.getElementById("loader").style.display="none";
}

// DOWNLOAD
function download(){
let m=document.getElementById("month").value;
window.location="/export?month="+m;
}
</script>

</body>
</html>
